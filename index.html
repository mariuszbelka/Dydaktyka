<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ćwiczenia / Exercises</title>
<script>
  // Stare linki do symulatora LC (sprzed podziału repozytorium) → lc/
  if (/^#(zajecia|lessons|wzory|formulas|s=)/.test(location.hash)) location.replace("lc/" + location.search + location.hash);
</script>
<link rel="stylesheet" href="shared/css/base.css">
<style>
  .home { max-width: 960px; margin: 0 auto; padding: 8px 20px 32px; }
  @media (max-width: 960px) { .home { padding: 8px 16px 24px; } }
  .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 8px; }
  .course { display: flex; flex-direction: column; gap: 8px; }
  .course h2 { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; }
  .course p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; }
  .course.off { opacity: 0.6; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { text-decoration: none; }
  .foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="header-actions">
    <div class="seg" id="langSeg" aria-label="Język / Language"><button data-lang="pl" lang="pl">PL</button><button data-lang="en" lang="en">EN</button></div>
  </div>
</header>
<div class="home">
  <div class="courses">
    <section class="card course">
      <span class="badge good" data-i18n="available" style="align-self:flex-start"></span>
      <h2 data-i18n="lcTitle"></h2>
      <p data-i18n="lcDesc"></p>
      <div class="links">
        <a class="btn primary" data-href="lc/" data-i18n="open"></a>
        <a class="btn" data-href="lc/" data-mode="lessons" data-i18n="lessons"></a>
        <a class="btn" data-href="lc/" data-mode="formulas" data-i18n="formulas"></a>
      </div>
    </section>
    <section class="card course off">
      <span class="badge warn" data-i18n="soon" style="align-self:flex-start"></span>
      <h2 data-i18n="msTitle"></h2><p data-i18n="msDesc"></p>
    </section>
    <section class="card course off">
      <span class="badge warn" data-i18n="soon" style="align-self:flex-start"></span>
      <h2 data-i18n="extTitle"></h2><p data-i18n="extDesc"></p>
    </section>
    <section class="card course off">
      <span class="badge warn" data-i18n="soon" style="align-self:flex-start"></span>
      <h2 data-i18n="bioTitle"></h2><p data-i18n="bioDesc"></p>
    </section>
  </div>
  <p class="foot" data-i18n="footer"></p>
</div>
<script src="i18n/pl.js"></script>
<script src="i18n/en.js"></script>
<script src="shared/js/i18n.js"></script>
<script>
  applyI18n();
  const HASH = { pl: { lessons: "#zajecia", formulas: "#wzory" }, en: { lessons: "#lessons", formulas: "#formulas" } };
  document.querySelectorAll("a[data-href]").forEach(a => {
    a.href = a.dataset.href + "?lang=" + LANG + (a.dataset.mode ? HASH[LANG][a.dataset.mode] : "");
  });
  document.querySelectorAll("#langSeg button").forEach(b => b.addEventListener("click", () => switchLang(b.dataset.lang)));
</script>
</body>
</html>
